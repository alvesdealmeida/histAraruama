<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Araruama: Expedição Zen Atualizada</title>
    <style>
        :root { --gold: #f4d03f; --danger: #ff4757; --deep-green: #1b4d3e; --success: #2ecc71; --sand: #f5e6be; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        
        #ui { position: absolute; top: 10px; left: 10px; right: 10px; color: white; z-index: 10; pointer-events: none; display: none; }
        #stats { display: flex; justify-content: space-between; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 12px; border: 2px solid var(--gold); }
        .label { color: var(--gold); font-size: 0.6rem; display: block; text-transform: uppercase; }
        .val { font-size: 1rem; font-weight: bold; }

        #btn-desistir {
            position: absolute; bottom: 20px; right: 20px; width: 50px; height: 50px; 
            background: #a00000; border: 2px solid var(--gold); border-radius: 50%;
            color: white; font-size: 1.2rem; display: none; align-items: center; 
            justify-content: center; z-index: 500;
        }

        #msg-overlay { 
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-size: 1.8rem; font-weight: bold; display: none; z-index: 600;
            text-shadow: 2px 2px 4px #000; text-align: center; width: 80%;
        }

        .modal { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; align-items: center; justify-content: center; 
            background: rgba(0,0,0,0.8); z-index: 400; 
        }
        .card { 
            background: var(--sand); width: 85%; max-width: 350px; border-radius: 15px; 
            overflow: hidden; text-align: center; border: 3px solid var(--deep-green);
        }
        .card-header { background: var(--deep-green); color: var(--gold); padding: 10px; }
        .card-body { padding: 15px; color: var(--deep-green); }

        .tabs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 10px; }
        .tab { padding: 6px; background: rgba(0,0,0,0.1); font-size: 0.6rem; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .tab.active { background: var(--deep-green); color: var(--gold); }

        .btn-main { 
            background: var(--deep-green); color: var(--gold); padding: 12px; border: none; 
            border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer;
        }
    </style>
</head>
<body>

<div id="msg-overlay"></div>
<div id="btn-desistir" onclick="desistir()">🚪</div>

<div id="ui">
    <div id="stats">
        <div><span class="label">📍 LOCAL</span><span id="txt-loc" class="val">-</span></div>
        <div><span class="label">⏳ TEMPO</span><span id="txt-time" class="val">60s</span></div>
        <div><span class="label">⭐ PONTOS</span><span id="txt-target" class="val">0/10</span></div>
    </div>
</div>

<div id="modal" class="modal">
    <div class="card">
        <div class="card-header"><h4>MODO TRANQUILO</h4></div>
        <div class="card-body">
            <div class="tabs-grid" id="tabs-container"></div>
            <span id="m-icon" style="font-size: 2.5rem; display: block; margin: 10px 0;">🐚</span>
            <h3 id="m-title" style="margin: 5px 0;">-</h3>
            <p id="m-text" style="font-size: 0.8rem; margin-bottom: 15px;">Colete os itens no seu tempo.</p>
            <button class="btn-main" onclick="startLevel()">INICIAR</button>
        </div>
    </div>
</div>

<canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let gameTimer;

    const districts = [
        { name: "Centro", title: "Sambaquis", icon: "🐚", enemy: "🦀", bg: "#87CEEB", gr: "#f4d03f" },
        { name: "S. Vicente", title: "Laranjas", icon: "🍊", enemy: "🐛", bg: "#2d5a27", gr: "#8b4513" },
        { name: "Laguna", title: "Salinas", icon: "🧂", enemy: "⛈️", bg: "#0077be", gr: "#eee" },
        { name: "Praia Seca", title: "Mar e Lagoa", icon: "🏄", enemy: "☀️", bg: "#00a8ff", gr: "#f5e6be" },
        { name: "Iguabinha", title: "Águas Rasas", icon: "🛶", enemy: "🦟", bg: "#48dbfb", gr: "#2ecc71" },
        { name: "M. Grande", title: "Fazendas", icon: "🐎", enemy: "🚜", bg: "#57606f", gr: "#2f3542" }
    ];

    let level = 0, score = 0, timeLeft = 60, gameActive = false, speedMult = 0.8;
    let player = { x: 0, y: 0 }; let items = [];

    function renderTabs() {
        const container = document.getElementById('tabs-container');
        container.innerHTML = "";
        districts.forEach((d, i) => {
            const t = document.createElement('div');
            t.className = `tab ${i === level ? 'active' : ''}`;
            t.innerText = d.name.split(' ')[0];
            t.onclick = () => { level = i; renderTabs(); updateMenu(); };
            container.appendChild(t);
        });
    }

    function updateMenu() {
        const d = districts[level];
        document.getElementById('m-icon').innerText = d.icon;
        document.getElementById('m-title').innerText = d.title;
    }

    function startLevel() {
        document.getElementById('modal').style.display = 'none';
        document.getElementById('ui').style.display = 'block';
        document.getElementById('btn-desistir').style.display = 'flex';
        score = 0; items = []; timeLeft = 60; 
        speedMult = 0.8; 
        gameActive = true;
        updateUI();
        clearInterval(gameTimer);
        gameTimer = setInterval(() => {
            timeLeft--;
            if(timeLeft <= 0) gameOver("FIM DO TEMPO!");
            updateUI();
        }, 1000);
        
        // Quantidade de objetos atualizada para 12
        for(let i=0; i<12; i++) spawn(true); 
    }

    function spawn(init = false) {
        if (!gameActive && !init) return;
        
        // Velocidade atualizada com base na lógica do anexo
        // s: (2 + (level * 0.5)) + Math.random() * 2
        let baseSpeed = (2 + (level * 0.5)) + Math.random() * 2; 
        
        items.push({ 
            x: Math.random() * (canvas.width - 60) + 30, 
            y: init ? (Math.random() * -canvas.height) : -40, 
            isG: Math.random() > 0.4,
            s: baseSpeed // Atribuindo a nova velocidade calculada[cite: 2]
        });
    }

    function gameOver(txt) {
        gameActive = false; clearInterval(gameTimer);
        const m = document.getElementById('msg-overlay');
        m.innerText = txt; m.style.color = "var(--danger)"; m.style.display = 'block';
        setTimeout(() => { m.style.display = 'none'; desistir(); }, 2000);
    }

    function desistir() {
        gameActive = false; clearInterval(gameTimer);
        document.getElementById('ui').style.display = 'none';
        document.getElementById('btn-desistir').style.display = 'none';
        document.getElementById('modal').style.display = 'flex';
        renderTabs(); updateMenu();
    }

    function loop() {
        if(gameActive) {
            const d = districts[level];
            ctx.fillStyle = d.bg; ctx.fillRect(0,0,canvas.width, canvas.height);
            ctx.fillStyle = d.gr; ctx.fillRect(0, canvas.height*0.9, canvas.width, canvas.height*0.1);
            
            ctx.fillStyle = "rgba(255,255,255,0.9)";
            ctx.beginPath(); ctx.arc(player.x, player.y, 25, 0, Math.PI*2); ctx.fill();

            for(let i = items.length - 1; i >= 0; i--) {
                let it = items[i]; it.y += it.s;
                ctx.font = "35px Arial"; ctx.textAlign = "center";
                ctx.fillText(it.isG ? d.icon : d.enemy, it.x, it.y);
                
                if(Math.hypot(player.x - it.x, player.y - it.y) < 45) {
                    if(it.isG) { 
                        score++; 
                    } else { 
                        score = Math.max(0, score - 1);
                    }
                    items.splice(i, 1); spawn(); updateUI();
                    if(score >= 10) { 
                        gameActive = false;
                        const m = document.getElementById('msg-overlay');
                        m.innerText = "MUITO BEM!"; m.style.color = "var(--success)"; m.style.display = "block";
                        setTimeout(() => { m.style.display = "none"; desistir(); }, 1500);
                    }
                } else if(it.y > canvas.height + 50) { items.splice(i, 1); spawn(); }
            }
        }
        requestAnimationFrame(loop);
    }

    function updateUI() {
        document.getElementById('txt-target').innerText = `${score}/10`;
        document.getElementById('txt-time').innerText = timeLeft + "s";
        document.getElementById('txt-loc').innerText = districts[level].name;
    }

    const mover = (e) => {
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        player.x = cx; player.y = cy;
    };
    window.addEventListener('mousemove', mover);
    window.addEventListener('touchmove', (e) => { mover(e); e.preventDefault(); }, {passive:false});
    window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
    
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    player = { x: canvas.width/2, y: canvas.height/2 };
    renderTabs(); updateMenu(); loop();
</script>
</body>
</html>
