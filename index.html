<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Araruama: Guardião Equilibrado</title>
    <style>
    :root { 
        --gold: #f4d03f; 
        --danger: #ff4757; 
        --deep-green: #1b4d3e; 
        --success: #2ecc71; 
        --sand: #f5e6be; 
        /* Novas cores para o tema Água */
        --water-shallow: #48dbfb; 
        --water-deep: #1e37b8; 
    }

    body, html { 
        margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; 
        font-family: 'Georgia', serif; touch-action: none; 
        
        /* --- NOVO FUNDO GRADIENTE AZUL --- */
        background: linear-gradient(to bottom, var(--water-shallow), var(--water-deep));
        /* --------------------------------- */
    }
    

    /* --- ESTILOS PARA ANIMAÇÃO DE PEIXES E BOLHAS --- */
    
    .ocean-animation {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none; /* Não atrapalha os cliques no menu */
        z-index: 1; /* Fica atrás do menu, mas na frente do fundo */
    }

    /* Estilo base para os peixes (emojis) */
    .fish {
        position: absolute;
        font-size: 2rem;
        opacity: 0.8;
        animation: swim linear infinite;
    }

    /* Animação dos Cavalos-Marinhos (Flutuam e balançam) */
    .seahorse {
        position: absolute;
        font-size: 2.5rem;
        animation: floatVertical 5s ease-in-out infinite;
    }

    /* Estilo base para as bolhas */
    .bubble {
        position: absolute;
        background: rgba(255, 255, 255, 0.4);
        border-radius: 50%;
        animation: rise linear infinite;
    }

    /* ANIMAÇÕES CSS */
    
    /* Peixes nadando da esquerda para a direita */
    @keyframes swim {
        0% { left: -10%; transform: scaleX(1); } /* Começa fora da tela */
        50% { transform: scaleX(1); }
        51% { transform: scaleX(-1); } /* Vira para o outro lado */
        100% { left: 110%; transform: scaleX(-1); } /* Sai da tela */

        0% { left: -10%; transform: scaleX(1); }
        100% { left: 110%; transform: scaleX(1); }
    }

    @keyframes floatVertical {
        0%, 100% { transform: translateY(0) rotate(-10deg); }
        50% { transform: translateY(-40px) rotate(10deg); }
    }

    /* Bolhas subindo */
    @keyframes rise {
        0% { bottom: -10%; opacity: 0; }
        10% { opacity: 0.8; }
        90% { opacity: 0.8; }
        100% { bottom: 110%; opacity: 0; }
    }

    /* Configuração individual dos Peixes (Velocidade e Posição) */
    .fish:nth-child(1) { top: 20%; animation-duration: 15s; animation-delay: 0s; }
    .fish:nth-child(2) { top: 40%; animation-duration: 20s; animation-delay: 5s; font-size: 1.5rem; }
    .fish:nth-child(3) { top: 65%; animation-duration: 12s; animation-delay: 2s; font-size: 2.5rem; }
    .fish:nth-child(4) { top: 80%; animation-duration: 18s; animation-delay: 8s; }

    .fish:nth-child(5) { top: 10%; animation-duration: 25s; animation-delay: 2s; }
    .fish:nth-child(6) { top: 55%; animation-duration: 14s; animation-delay: 4s; font-size: 1.2rem; }
    .fish:nth-child(9) { top: 35%; animation-duration: 30s; animation-delay: 1s; }

    /* Configuração individual das Bolhas */
    .bubble:nth-child(5) { left: 10%; width: 20px; height: 20px; animation-duration: 8s; }
    .bubble:nth-child(6) { left: 30%; width: 10px; height: 10px; animation-duration: 12s; animation-delay: 3s; }
    .bubble:nth-child(7) { left: 50%; width: 15px; height: 15px; animation-duration: 10s; animation-delay: 1s; }
    .bubble:nth-child(8) { left: 80%; width: 25px; height: 25px; animation-duration: 15s; animation-delay: 5s; }

    .bubble:nth-child(7) { left: 15%; width: 12px; height: 12px; animation-duration: 7s; }
    .bubble:nth-child(8) { left: 45%; width: 18px; height: 18px; animation-duration: 11s; }
    .bubble:nth-child(10) { left: 65%; width: 8px; height: 8px; animation-duration: 9s; }
    .bubble:nth-child(11) { left: 90%; width: 22px; height: 22px; animation-duration: 14s; }

    /* --- RESTANTE DO SEU CSS ORIGINAL (UI, MODAL, CARD) --- */
    
    #ui { position: absolute; top: 10px; left: 10px; right: 10px; color: white; z-index: 10; pointer-events: none; display: none; font-family: sans-serif; }
    #stats { display: flex; justify-content: space-between; background: rgba(0,0,0,0.9); padding: 10px; border-radius: 12px; border: 2px solid var(--gold); }
    .label { color: var(--gold); font-size: 0.6rem; display: block; text-transform: uppercase; }
    .val { font-size: 1rem; font-weight: bold; }

    #btn-desistir {
        position: absolute; bottom: 25px; right: 20px; width: 60px; height: 60px; 
        background: #800000; border: 3px solid var(--gold); border-radius: 50%;
        color: white; font-size: 1.8rem; display: none; align-items: center; 
        justify-content: center; z-index: 500; cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    #msg-overlay { 
        position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
        font-size: 2rem; font-weight: bold; display: none; z-index: 600;
        text-shadow: 2px 2px 0px #000; pointer-events: none; text-align: center; width: 90%;
    }

    .modal { 
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
        display: flex; align-items: center; justify-content: center; 
        background: rgba(0,0,0,0.5); /* Escurece o fundo para destacar o menu */
        z-index: 400; 
    }
    .card { 
        background: var(--sand); width: 90%; max-width: 400px; border-radius: 15px; 
        overflow: hidden; text-align: center; border: 4px solid var(--deep-green);
        box-shadow: 0 10px 25px rgba(0,0,0,0.5); /* Sombra para destacar */
        z-index: 401; /* Fica na frente das animações */
    }
    .card-header { background: var(--deep-green); color: var(--gold); padding: 12px; }
    .card-body { padding: 15px; color: var(--deep-green); }

    .tabs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 15px; }
    .tab { padding: 8px; background: rgba(0,0,0,0.1); font-size: 0.6rem; cursor: pointer; border-radius: 4px; font-weight: bold; border: 1px solid transparent; }
    .tab.active { background: var(--deep-green); color: var(--gold); border-color: var(--gold); }

    .btn-main { 
        background: var(--deep-green); color: var(--gold); padding: 12px; border: none; 
        border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; font-size: 1rem;
    }
    
    #damage-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(255,0,0,0.5); display:none; pointer-events:none; z-index:5; }
    #game { z-index: 2; } /* Canvas do jogo fica na frente das animações de fundo */
</style>

<body>
<body>
   <div class="ocean-animation">
    <!-- Adicione mais linhas como estas -->
    <div class="fish">🐟</div>
    <div class="fish">🐠</div>
    <div class="fish">🐡</div>
    <div class="fish">🦀</div> <!-- Um caranguejo nadador! -->
    <div class="fish">🦑</div> <!-- Uma lula! -->
    <div class="fish">🐟</div>
    
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>

    <!-- Cavalos-Marinhos -->
    <div class="seahorse" style="top: 20%; left: 10%;">🐉</div>
    <div class="seahorse" style="top: 50%; left: 85%;">🐉</div>
    <div class="seahorse" style="top: 75%; left: 20%;">🐉</div>
    <div class="seahorse" style="top: 30%; left: 70%;">🐉</div>
</div>

    <div id="damage-overlay"></div>
    

<div id="damage-overlay"></div>
<div id="msg-overlay"></div>
<div id="btn-desistir" onclick="desistir()">🚪</div>

<div id="ui">
    <div id="stats">
        <div><span class="label">DISTRITO</span><span id="txt-loc" class="val">-</span></div>
        <div><span class="label">TEMPO</span><span id="txt-time" class="val">35s</span></div>
        <div><span class="label">RELÍQUIAS</span><span id="txt-target" class="val">0 / 10</span></div>
    </div>
</div>

<div id="modal" class="modal">
    <div class="card">
        <div class="card-header"><h2>DISTRITOS DE ARARUAMA</h2></div>
        <div class="card-body">
            <div class="tabs-grid" id="tabs-container"></div>
            <span id="m-icon" style="font-size: 3rem; display: block; margin-bottom: 5px;">🐚</span>
            <h3 id="m-title" style="margin: 5px 0;">-</h3>
            <p id="m-text" style="font-size: 0.8rem; margin-bottom: 15px; font-weight: bold;"></p>
            <button class="btn-main" onclick="startLevel()">INICIAR MISSÃO</button>
        </div>
    </div>
</div>

<div id="quiz-modal" class="modal" style="display:none;">
    <div class="card">
        <div class="card-header"><h3>TESTE DE CONHECIMENTO</h3></div>
        <div class="card-body">
            <p id="q-question" style="font-weight:bold; font-size: 1rem; margin-bottom: 15px;"></p>
            <div id="q-options" style="display:flex; flex-direction:column; gap:8px;"></div>
        </div>
    </div>
</div>

<canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let audioCtx, gameTimer;

    const districts = [
        { name: "Centro", title: "Sambaquis", icon: "🐚", enemy: "🦀", bg: "#87CEEB", gr: "#f4d03f", quiz: [{q: "Onde se localiza o museu arqueológico?", o: ["Praia Seca", "Centro (Sambaqui)", "S. Vicente"], a: 1}]},
        { name: "S. Vicente", title: "Citricultura", icon: "🍊", enemy: "🐛", bg: "#2d5a27", gr: "#8b4513", quiz: [{q: "A citricultura baseava-se em qual fruta?", o: ["Manga", "Laranja", "Caju"], a: 1}]},
        { name: "Laguna", title: "Ciclo do Sal", icon: "🧂", enemy: "⛈️", bg: "#0077be", gr: "#eee", quiz: [{q: "O sal vinha das águas de qual lagoa?", o: ["Juturnaíba", "Araruama", "Saquarema"], a: 1}]},
        { name: "Praia Seca", title: "Restinga", icon: "🏄", enemy: "☀️", bg: "#00a8ff", gr: "#f5e6be", quiz: [{q: "Praia Seca fica entre a Lagoa e o...", o: ["Rio", "Oceano Atlântico", "Pântano"], a: 1}]},
        { name: "Iguabinha", title: "Águas Calmas", icon: "🛶", enemy: "🦟", bg: "#48dbfb", gr: "#2ecc71", quiz: [{q: "As águas de Iguabinha são famosas por serem?", o: ["Calmas e Medicinais", "Turvas", "Onduladas"], a: 0}]},
        { name: "M. Grande", title: "Rural", icon: "🐎", enemy: "🚜", bg: "#57606f", gr: "#2f3542", quiz: [{q: "Qual a vocação de Morro Grande?", o: ["Agropecuária", "Salina", "Pesca"], a: 0}]}
    ];

    let level = 0, score = 0, timeLeft = 35, gameActive = false, speedMult = 1.0;
    let player = { x: 0, y: 0 }; let items = [];

    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playSnd(f, t, d, v=0.1) {
        if(!audioCtx) return;
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.setValueAtTime(v, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + d);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + d);
    }

    function renderTabs() {
        const container = document.getElementById('tabs-container');
        container.innerHTML = "";
        districts.forEach((d, i) => {
            const t = document.createElement('div');
            t.className = `tab ${i === level ? 'active' : ''}`;
            t.innerText = d.name.toUpperCase();
            t.onclick = () => { level = i; renderTabs(); updateMenu(); };
            container.appendChild(t);
        });
    }

    function updateMenu() {
        const d = districts[level];
        document.getElementById('m-icon').innerText = d.icon;
        document.getElementById('m-title').innerText = d.title;
        document.getElementById('m-text').innerText = `Colete 10 ${d.icon} para o Quiz final!`;
    }

    function startLevel() {
        initAudio();
        document.getElementById('modal').style.display = 'none';
        document.getElementById('ui').style.display = 'block';
        document.getElementById('btn-desistir').style.display = 'flex';
        score = 0; items = []; timeLeft = 15; 
        
        // Mantemos o speedMult base do distrito, mas o cálculo de velocidade vem do anexo
        speedMult = 1.0; 
        
        gameActive = true;
        updateUI();
        clearInterval(gameTimer);
        gameTimer = setInterval(() => {
            timeLeft--;
            if(timeLeft <= 0) gameOver("FIM DO TEMPO!");
            updateUI();
        }, 1000);

        // DADO DO ANEXO: QUANTIDADE DE OBJETOS = 12
        for(let i=0; i<18; i++) spawn(true);
    }

    function spawn(init = false) {
        if (!gameActive && !init) return;
        
        // DADO DO ANEXO: Lógica de Velocidade (s)
        let baseSpeed = (2.2 + (level * 0.7)) + Math.random() * 2;
        
        items.push({ 
            x: Math.random() * (canvas.width - 60) + 30, 
            y: init ? (Math.random() * -canvas.height) : -50, 
            isG: Math.random() > 0.45,
            s: baseSpeed
        });
    }

    function gameOver(txt) {
        gameActive = false; clearInterval(gameTimer);
        playSnd(100, 'sawtooth', 0.8);
        const m = document.getElementById('msg-overlay');
        m.innerText = txt; m.style.color = "var(--danger)"; m.style.display = 'block';
        setTimeout(() => { m.style.display = 'none'; desistir(); }, 2000);
    }

    function desistir() {
        gameActive = false; clearInterval(gameTimer);
        document.getElementById('ui').style.display = 'none';
        document.getElementById('quiz-modal').style.display = 'none';
        document.getElementById('btn-desistir').style.display = 'none';
        document.getElementById('modal').style.display = 'flex';
        renderTabs(); updateMenu();
    }

    function showQuiz() {
        gameActive = false; clearInterval(gameTimer);
        const d = districts[level];
        const q = d.quiz[0];
        document.getElementById('q-question').innerText = q.q;
        const opts = document.getElementById('q-options');
        opts.innerHTML = "";
        q.o.forEach((opt, i) => {
            const b = document.createElement('button');
            b.className = "btn-main";
            b.innerText = opt;
            b.onclick = () => {
                if(i === q.a) {
                    playSnd(800, 'sine', 0.5);
                    const m = document.getElementById('msg-overlay');
                    m.innerText = "EXCELENTE!"; m.style.color = "var(--success)"; m.style.display = 'block';
                    setTimeout(() => { m.style.display = 'none'; level = (level + 1) % districts.length; desistir(); }, 1500);
                } else {
                    document.getElementById('quiz-modal').style.display = 'none';
                    gameOver("OPS! TENTE NOVAMENTE.");
                }
            };
            opts.appendChild(b);
        });
        document.getElementById('quiz-modal').style.display = 'flex';
    }

    function loop() {
        if(gameActive) {
            const d = districts[level];
            ctx.fillStyle = d.bg; ctx.fillRect(0,0,canvas.width, canvas.height);
            ctx.fillStyle = d.gr; ctx.fillRect(0, canvas.height*0.88, canvas.width, canvas.height*0.12);
            
            ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.beginPath(); ctx.arc(player.x, player.y, 25, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = "var(--gold)"; ctx.lineWidth = 3; ctx.stroke();

            for(let i = items.length - 1; i >= 0; i--) {
                let it = items[i]; it.y += it.s;
                ctx.font = "35px Arial"; ctx.textAlign = "center";
                ctx.fillText(it.isG ? d.icon : d.enemy, it.x, it.y);
                
                if(Math.hypot(player.x - it.x, player.y - it.y) < 45) {
                    if(it.isG) { 
                        score++; 
                        playSnd(500 + score*20, 'sine', 0.1); 
                    } else { 
                        score = Math.max(0, score - 2); playSnd(150, 'sawtooth', 0.2);
                        document.getElementById('damage-overlay').style.display='block'; 
                        setTimeout(()=>document.getElementById('damage-overlay').style.display='none', 80); 
                    }
                    items.splice(i, 1); spawn(); updateUI();
                    if(score >= 10) showQuiz();
                } else if(it.y > canvas.height + 50) { items.splice(i, 1); spawn(); }
            }
        }
        requestAnimationFrame(loop);
    }

    function updateUI() {
        document.getElementById('txt-target').innerText = `${score} / 10`;
        document.getElementById('txt-time').innerText = timeLeft + "s";
        document.getElementById('txt-loc').innerText = districts[level].name;
    }

    const mover = (e) => {
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        player.x = cx; player.y = cy;
    };
    window.addEventListener('mousemove', mover);
    window.addEventListener('touchmove', (e) => { mover(e); e.preventDefault(); }, {passive:false});
    window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
    
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    player = { x: canvas.width/2, y: canvas.height/2 };
    renderTabs(); updateMenu(); loop();
</script>
<div style="text-align: center; margin-top: 20px;">
    <!-- Contador para o Jogo de História Araruama -->
    <img width="100" src="https://hits.seeyoufarm.com/api/count/incr/badge.svg?url=https://alvesdealmeida.github.io/histAraruama/&count_bg=%23E67E22&title_bg=%23555555&title=Acessos+Araruama&edge_flat=false" alt="Contador de Visitas">
</div>
</body>
