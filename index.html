<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Araruama: Guardião da História - HARD</title>
    <style>
        :root { --gold: #f4d03f; --danger: #ff4757; --deep-green: #1b4d3e; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
        
        /* UI de Jogo */
        #ui { position: absolute; top: 10px; left: 10px; color: white; z-index: 10; pointer-events: none; }
        #stats { display: flex; gap: 10px; background: rgba(0,0,0,0.8); padding: 12px; border-radius: 12px; border: 2px solid var(--gold); }
        .label { color: var(--gold); font-size: 0.7rem; display: block; text-transform: uppercase; letter-spacing: 1px; }
        .val { font-size: 1rem; font-weight: bold; }

        /* Estilização da Tela Inicial e Modais */
        .modal { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; align-items: center; justify-content: center; 
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); /* Degradê Cinematográfico */
            z-index: 100; 
        }

        .card { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(10px); /* Efeito de Vidro */
            color: #333; width: 90%; max-width: 420px; border-radius: 25px; 
            overflow: hidden; text-align: center; border: 4px solid var(--gold); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .card-header { background: var(--deep-green); color: white; padding: 20px; font-size: 1.3rem; font-weight: bold; }
        .card-body { padding: 30px; }
        
        .quiz-options { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .opt-btn { background: #f1f2f6; border: 2px solid #dfe4ea; padding: 15px; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .opt-btn:hover { background: var(--gold); }

        .btn-main { 
            background: var(--deep-green); color: white; padding: 18px; border: none; 
            border-radius: 50px; font-weight: bold; cursor: pointer; width: 100%; 
            font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        #damage-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(255,0,0,0.3); display:none; pointer-events:none; z-index:5; }
        canvas { display: block; }

        .icon-intro { font-size: 4rem; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

<div id="damage-overlay"></div>
<div id="ui">
    <div id="stats">
        <div><span class="label">NÍVEL</span><span id="txt-lv" class="val">1 / 9</span></div>
        <div><span class="label">META</span><span id="txt-target" class="val">0 / 10</span></div>
        <div><span class="label">LOCAL</span><span id="txt-loc" class="val">-</span></div>
    </div>
</div>

<!-- Modal Principal (Início e Transição) -->
<div id="modal" class="modal">
    <div class="card">
        <div class="card-header"><span id="m-title"></span></div>
        <div class="card-body">
            <span class="icon-intro" id="m-icon">🏛️</span>
            <p id="m-text" style="font-size: 1.1rem; line-height: 1.5; color: #555; margin-bottom: 25px;"></p>
            <button class="btn-main" onclick="startLevel()">Iniciar Jornada</button>
            <p style="font-size: 0.7rem; color: #999; margin-top: 15px;">Mova o dedo ou mouse para coletar itens e desviar de perigos.</p>
        </div>
    </div>
</div>

<!-- Modal do Quiz -->
<div id="quiz-modal" class="modal" style="display:none">
    <div class="card">
        <div class="card-header">🧩 DESAFIO DO CONHECIMENTO</div>
        <div class="card-body">
            <p id="q-question" style="font-weight:bold; font-size: 1.2rem; margin-bottom: 20px;"></p>
            <div id="q-options" class="quiz-options"></div>
        </div>
    </div>
</div>

<canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(f, t, d) {
        try {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = t; o.frequency.value = f; g.gain.setValueAtTime(0.1, audioCtx.currentTime);
            o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+d);
        } catch(e){}
    }

    let level = 0, score = 0, gameActive = false;
    let player = { x: 0, y: 0 }; let items = [];

    const campaign = [
        { title: "OS SAMBAQUIS", loc: "Centro", info: "Araruama significa 'Lugar de conchas'. Proteja os vestígios milenares e desvie dos caranguejos!", icon: "🐚", enemy: "🦀", bg: "#87CEEB", gr: "#f4d03f", q: "Qual o significado tupi de Araruama?", opts: ["Terra do Fogo", "Abundância de conchas", "Rio Salgado"], ans: 1 },
        { title: "A ALDEIA TUPINAMBÁ", loc: "Aldeia", info: "Navegue com os Tamoios pela laguna original. Cuidado com as fogueiras de guerra!", icon: "🛶", enemy: "🔥", bg: "#2d5a27", gr: "#8b4513", q: "Quem eram os habitantes originais da região?", opts: ["Tupinambás", "Incas", "Astecas"], ans: 0 },
        { title: "BATALHA DE 1575", loc: "Batalha", info: "O cerco à Aldeia de Araruama. Sobreviva ao ataque das tropas de Antônio Salema!", icon: "🏹", enemy: "💣", bg: "#4a4a4a", gr: "#333", q: "Quem liderou o ataque português em 1575?", opts: ["Cabral", "Antônio Salema", "D. Pedro I"], ans: 1 },
        { title: "CICLO DO SAL", loc: "Laguna", info: "O Ouro Branco impulsionou nossa economia. Não deixe o lixo poluir nossa riqueza!", icon: "💎", enemy: "🗑️", bg: "#0077be", gr: "#fff", q: "Como o sal era conhecido no auge da produção?", opts: ["Ouro Branco", "Prata da Terra", "Cristal Doce"], ans: 0 },
        { title: "OS MOINHOS DE VENTO", loc: "Orla", info: "Símbolos da nossa paisagem. Fuja das tempestades que assolam a orla!", icon: "🌀", enemy: "⛈️", bg: "#3498db", gr: "#eee", q: "Qual era a função original dos moinhos?", opts: ["Gerar eletricidade", "Bombear água salgada", "Apenas decoração"], ans: 1 },
        { title: "CAFÉ EM SÃO VICENTE", loc: "Zona Rural", info: "A riqueza vinha da terra. Proteja as sacas de café das pragas famintas!", icon: "☕", enemy: "🐛", bg: "#5d4037", gr: "#3e2723", q: "Qual o distrito famoso pela vocação agrícola?", opts: ["Iguabinha", "São Vicente", "Parati"], ans: 1 },
        { title: "RESTINGA DE PRAIA SECA", loc: "Praia Seca", info: "O paraíso entre o mar e a lagoa. Cuidado com as correntes e predadores!", icon: "🏄", enemy: "🦈", bg: "#00bcd4", gr: "#ffeb3b", q: "Onde se localiza o distrito de Praia Seca?", opts: ["No Morro", "Na Restinga", "No Centro"], ans: 1 },
        { title: "LAGOA DE JUTURNAÍBA", loc: "Água Doce", info: "Nossa maior reserva de água doce. Fuja dos jacarés da reserva!", icon: "💧", enemy: "🐊", bg: "#1b4d3e", gr: "#4b3621", q: "Juturnaíba é uma importante reserva de:", opts: ["Sal", "Água Doce", "Petróleo"], ans: 1 },
        { title: "A EMANCIPAÇÃO", loc: "Câmara", info: "6 de Fevereiro de 1859. O cadeado da submissão deve ser destruído!", icon: "📜", enemy: "🔒", bg: "#1a2a6c", gr: "#2d5a27", q: "Em que dia se comemora a emancipação da cidade?", opts: ["1 de Janeiro", "6 de Fevereiro", "13 de Maio"], ans: 1 }
    ];

    function updateModal() {
        const c = campaign[level];
        const titleEl = document.getElementById('m-title');
        const iconEl = document.getElementById('m-icon');

        if(level === 0) {
            titleEl.innerText = "GUARDIÃO DE ARARUAMA";
            iconEl.innerText = "🛡️";
        } else {
            titleEl.innerText = c.title;
            iconEl.innerText = c.icon;
        }
        
        document.getElementById('m-text').innerText = c.info;
        document.getElementById('modal').style.display = 'flex';
        updateUI();
    }

    function startLevel() {
        document.getElementById('modal').style.display = 'none';
        score = 0; items = []; 
        for(let i=0; i<12; i++) spawn(true);
        gameActive = true; updateUI(); if(level === 0) loop();
    }

    function spawn(init = false) {
        const isGood = Math.random() > (0.4 + (level * 0.03));
        items.push({ 
            x: Math.random() * canvas.width, 
            y: init ? (Math.random() * -canvas.height) : -50, 
            isG: isGood, 
            s: (2 + (level * 0.5)) + Math.random() * 2,
            swing: Math.random() * 0.05
        });
    }

    function updateUI() {
        const c = campaign[level];
        document.getElementById('txt-lv').innerText = `${level + 1} / 9`;
        document.getElementById('txt-target').innerText = `${score} / 10`;
        document.getElementById('txt-loc').innerText = c.loc;
    }

    function triggerDamage() {
        const ov = document.getElementById('damage-overlay');
        ov.style.display = 'block';
        setTimeout(() => ov.style.display = 'none', 150);
    }

    function showQuiz() {
        gameActive = false; const c = campaign[level];
        document.getElementById('q-question').innerText = c.q;
        const div = document.getElementById('q-options'); div.innerHTML = "";
        c.opts.forEach((o, i) => {
            const b = document.createElement('button'); b.className = "opt-btn"; b.innerText = o;
            b.onclick = () => {
                document.getElementById('quiz-modal').style.display = 'none';
                if(i === c.ans) { 
                    playSound(800,'sine',0.3); level++; 
                    if(level < 9) {
                        updateModal(); 
                    } else {
                        alert("PARABÉNS! VOCÊ RESTAUROU A HISTÓRIA DE ARARUAMA!"); 
                        level = 0; score = 0; gameActive = false; updateModal();
                    }
                } else { 
                    playSound(100,'square',0.5); alert("RESPOSTA INCORRETA! O fluxo do tempo foi interrompido. Tente novamente o nível."); 
                    score = 0; startLevel(); 
                }
            };
            div.appendChild(b);
        });
        document.getElementById('quiz-modal').style.display = 'flex';
    }

    function loop() {
        if(gameActive && level < 9) {
            const c = campaign[level];
            ctx.fillStyle = c.bg; ctx.fillRect(0,0,canvas.width, canvas.height);
            ctx.fillStyle = c.gr; ctx.fillRect(0, canvas.height*0.85, canvas.width, canvas.height*0.15);
            
            // Jogador (Guardião)
            ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(player.x, player.y, 25, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = "gold"; ctx.lineWidth = 4; ctx.stroke();
            
            items.forEach((it, i) => {
                it.y += it.s;
                it.x += Math.sin(it.y * it.swing) * 2;
                if(it.y > canvas.height) { items.splice(i,1); spawn(); }
                ctx.font = "38px Arial"; ctx.textAlign = "center";
                ctx.fillText(it.isG ? c.icon : c.enemy, it.x, it.y);
                if(Math.hypot(player.x-it.x, player.y-it.y) < 40) {
                    if(it.isG) { 
                        score++; playSound(600,'sine',0.1); 
                    } else { 
                        score = Math.max(0, score - 3); 
                        playSound(150,'sawtooth',0.3); 
                        triggerDamage();
                    }
                    items.splice(i, 1); spawn(); updateUI();
                    if(score >= 10) showQuiz();
                }
            });
        }
        requestAnimationFrame(loop);
    }

    const mv = (e) => { 
        player.x = e.touches ? e.touches[0].clientX : e.clientX; 
        player.y = e.touches ? e.touches[0].clientY : e.clientY; 
        if(e.touches) e.preventDefault(); 
    };
    window.addEventListener('touchmove', mv, {passive:false});
    window.addEventListener('mousemove', mv);
    window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    player = { x: canvas.width/2, y: canvas.height/2 };
    updateModal();
</script>
</body>
</html>
