<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Araruama: Expedição Tranquila</title>
    <style>
        :root { --gold: #f4d03f; --deep-green: #1b4d3e; --sand: #f5e6be; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        
        #ui { position: absolute; top: 10px; left: 10px; right: 10px; color: white; z-index: 10; pointer-events: none; display: none; }
        #stats { display: flex; justify-content: space-between; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 12px; border: 2px solid var(--gold); }
        .label { color: var(--gold); font-size: 0.6rem; display: block; text-transform: uppercase; }
        .val { font-size: 1.1rem; font-weight: bold; }

        #btn-desistir {
            position: absolute; bottom: 20px; right: 20px; width: 50px; height: 50px; 
            background: #a00000; border: 2px solid var(--gold); border-radius: 50%;
            color: white; font-size: 1.5rem; display: none; align-items: center; justify-content: center; z-index: 500;
        }

        .modal { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; align-items: center; justify-content: center; 
            background: rgba(0,0,0,0.8); z-index: 400; 
        }
        .card { 
            background: var(--sand); width: 85%; max-width: 350px; border-radius: 15px; 
            overflow: hidden; text-align: center; border: 3px solid var(--deep-green);
        }
        .card-header { background: var(--deep-green); color: var(--gold); padding: 10px; }
        .card-body { padding: 15px; color: var(--deep-green); }

        .tabs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 10px; }
        .tab { padding: 6px; background: rgba(0,0,0,0.1); font-size: 0.6rem; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .tab.active { background: var(--deep-green); color: var(--gold); }

        .btn-main { background: var(--deep-green); color: var(--gold); padding: 12px; border: none; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

<div id="btn-desistir" onclick="desistir()">🚪</div>

<div id="ui">
    <div id="stats">
        <div><span class="label">📍 LOCAL</span><span id="txt-loc" class="val">-</span></div>
        <div><span class="label">⭐ PONTOS</span><span id="txt-target" class="val">0/10</span></div>
    </div>
</div>

<div id="modal" class="modal">
    <div class="card">
        <div class="card-header"><h4>EXPLORAR ARARUAMA</h4></div>
        <div class="card-body">
            <div class="tabs-grid" id="tabs-container"></div>
            <span id="m-icon" style="font-size: 3rem; display: block; margin: 10px 0;">🐚</span>
            <h3 id="m-title" style="margin: 5px 0;">-</h3>
            <p style="font-size: 0.8rem; margin-bottom: 15px;">Mova o círculo para coletar os itens!</p>
            <button class="btn-main" onclick="startLevel()">INICIAR JOGO</button>
        </div>
    </div>
</div>

<canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const districts = [
        { name: "Centro", icon: "🐚", enemy: "🦀", bg: "#87CEEB", gr: "#f4d03f" },
        { name: "S. Vicente", icon: "🍊", enemy: "🐛", bg: "#2d5a27", gr: "#8b4513" },
        { name: "Laguna", icon: "🧂", enemy: "⛈️", bg: "#0077be", gr: "#eee" },
        { name: "Praia Seca", icon: "🏄", enemy: "☀️", bg: "#00a8ff", gr: "#f5e6be" },
        { name: "Iguabinha", icon: "🛶", enemy: "🦟", bg: "#48dbfb", gr: "#2ecc71" },
        { name: "M. Grande", icon: "🐎", enemy: "🚜", bg: "#57606f", gr: "#2f3542" }
    ];

    let level = 0, score = 0, gameActive = false;
    let player = { x: 0, y: 0 }; let items = [];

    function renderTabs() {
        const container = document.getElementById('tabs-container');
        container.innerHTML = "";
        districts.forEach((d, i) => {
            const t = document.createElement('div');
            t.className = `tab ${i === level ? 'active' : ''}`;
            t.innerText = d.name.split(' ')[0];
            t.onclick = () => { level = i; renderTabs(); updateMenu(); };
            container.appendChild(t);
        });
    }

    function updateMenu() {
        const d = districts[level];
        document.getElementById('m-icon').innerText = d.icon;
        document.getElementById('m-title').innerText = d.name;
    }

    function startLevel() {
        document.getElementById('modal').style.display = 'none';
        document.getElementById('ui').style.display = 'block';
        document.getElementById('btn-desistir').style.display = 'flex';
        score = 0; items = []; 
        gameActive = true;
        updateUI();
        // Começa com 10 itens na tela para ter fartura!
        for(let i=0; i<10; i++) spawn(true);
    }

    function spawn(init = false) {
        if (!gameActive && !init) return;
        // VELOCIDADE FIXA E BEM LENTA: 1.2
        let slowSpeed = 1.2 + Math.random() * 0.8;
        items.push({ 
            x: Math.random() * (canvas.width - 60) + 30, 
            y: init ? (Math.random() * -canvas.height) : -50, 
            isG: Math.random() > 0.3, // Mais itens bons do que ruins
            s: slowSpeed
        });
    }

    function desistir() {
        gameActive = false;
        document.getElementById('ui').style.display = 'none';
        document.getElementById('btn-desistir').style.display = 'none';
        document.getElementById('modal').style.display = 'flex';
        renderTabs(); updateMenu();
    }

    function loop() {
        if(gameActive) {
            const d = districts[level];
            ctx.fillStyle = d.bg; ctx.fillRect(0,0,canvas.width, canvas.height);
            ctx.fillStyle = d.gr; ctx.fillRect(0, canvas.height*0.9, canvas.width, canvas.height*0.1);
            
            // Jogador maior para facilitar a captura
            ctx.fillStyle = "rgba(255,255,255,0.8)";
            ctx.beginPath(); ctx.arc(player.x, player.y, 35, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = "white"; ctx.lineWidth = 2; ctx.stroke();

            for(let i = items.length - 1; i >= 0; i--) {
                let it = items[i]; 
                it.y += it.s; // Movimento suave
                
                ctx.font = "40px Arial"; ctx.textAlign = "center";
                ctx.fillText(it.isG ? d.icon : d.enemy, it.x, it.y);
                
                // Colisão facilitada
                if(Math.hypot(player.x - it.x, player.y - it.y) < 55) {
                    if(it.isG) { score++; } 
                    else { score = Math.max(0, score - 1); }
                    items.splice(i, 1); spawn(); updateUI();
                    
                    if(score >= 10) {
                        alert("Parabéns! Você completou o distrito de " + d.name);
                        desistir();
                    }
                } else if(it.y > canvas.height + 50) { 
                    items.splice(i, 1); spawn(); 
                }
            }
        }
        requestAnimationFrame(loop);
    }

    function updateUI() {
        document.getElementById('txt-target').innerText = `${score}/10`;
        document.getElementById('txt-loc').innerText = districts[level].name;
    }

    const mover = (e) => {
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        player.x = cx; player.y = cy;
    };
    window.addEventListener('mousemove', mover);
    window.addEventListener('touchmove', (e) => { mover(e); e.preventDefault(); }, {passive:false});
    window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
    
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    player = { x: canvas.width/2, y: canvas.height/2 };
    renderTabs(); updateMenu(); loop();
</script>
</body>
</html>
